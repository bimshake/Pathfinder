<title>Pathfinder Perpustakaan Kemenkes</title>
<style>
:root{--bg:#fff;--fg:#1c2430;--mu:#5b6676;--ac:#0b6b4f;--bd:#d9dee5;--sb:#f3f6f5;--warn:#9a5b00;--wbg:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--fg:#e6eaee;--mu:#98a3b1;--ac:#5fd0a5;--bd:#2c343e;--sb:#1a2027;--warn:#f0b35a;--wbg:#2a2214}}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--fg)}
.wrap{display:flex;min-height:100vh}nav{width:270px;flex:none;background:var(--sb);border-right:1px solid var(--bd);padding:16px;position:sticky;top:0;height:100vh;overflow:auto;font:14px/1.4 system-ui,sans-serif}
nav h1{font-size:15px;margin:0 0 4px;color:var(--ac)}nav p{margin:0 0 12px;color:var(--mu);font-size:12px}
nav input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);margin-bottom:10px}
nav a{display:block;padding:6px 8px;border-radius:6px;color:var(--fg);text-decoration:none}nav a:hover{background:var(--bd)}nav a.on{background:var(--ac);color:#fff}
main{flex:1;max-width:820px;padding:28px 32px 60px;margin:0 auto}
h2{font:700 28px/1.2 system-ui,sans-serif;margin:0 0 4px}.sub{color:var(--mu);font:13px system-ui,sans-serif;margin-bottom:20px}
h3{font:700 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);border-bottom:2px solid var(--ac);padding-bottom:4px;margin:28px 0 10px}
.src{font:12px system-ui,sans-serif;color:var(--mu);word-break:break-all}
ol,ul{padding-left:22px}li{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0;list-style:none}.chips li{margin:0;border:1px solid var(--bd);border-radius:999px;padding:2px 12px;font:14px system-ui,sans-serif}
a{color:var(--ac);word-break:break-word}.meta{font:13px system-ui,sans-serif;color:var(--mu)}
.res{font-size:14px;margin:4px 0 0;padding-left:18px}.res li{margin:0}
.warn{background:var(--wbg);color:var(--warn);border-radius:8px;padding:8px 12px;font:13px system-ui,sans-serif;margin-bottom:16px}
.empty{color:var(--warn);font:italic 14px system-ui,sans-serif}
@media(max-width:760px){.wrap{display:block}nav{width:auto;height:auto;position:static;max-height:220px}main{padding:20px 16px}}
@media print{nav,.warn{display:none}main{max-width:none;padding:0}h3{break-after:avoid}li{break-inside:avoid}}
